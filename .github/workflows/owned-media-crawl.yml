name: Crawl Owned Media (YouTube/Instagram)

on:
  schedule:
    # 주 1회 · 매주 월요일 KST 오전 10시 (UTC 월요일 01:00). 비용(Apify) 고려한 주간 주기.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      creator_id:
        description: "특정 크리에이터 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Node Playwright 크롤러는 owned-media-monitor/ 에 격리.
    defaults:
      run:
        working-directory: owned-media-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install yt-dlp + ffmpeg (유튜브 영상 다운로드용)
        # 설치 실패해도 크롤은 계속(다운로드 못 하면 임베드로 폴백)되도록 best-effort.
        continue-on-error: true
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRAWL_CREATOR_ID: ${{ github.event.inputs.creator_id }}
          # 인스타 수집은 Apify instagram-scraper 사용(없으면 인스타는 건너뜀). 유튜브는 Playwright(Apify 불필요).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 프로필당 최신 개수(비용 조절). 60명·주1회·5개면 무료 한도 안.
          IG_RESULTS_LIMIT: "5"
        run: node crawl.mjs
