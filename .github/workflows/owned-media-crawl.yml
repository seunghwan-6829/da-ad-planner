name: Crawl Owned Media (YouTube/Instagram)

on:
  # ⛔ 2026-09-02 통합으로 이 저장소의 자동 실행을 중단했다.
  #    모든 크론은 seunghwan-6829/zerotomax-website 에서 돈다(같은 워크플로가 그대로 있고 Secrets 도 옮겼다).
  #    여기 두면 같은 작업이 두 번 돌아 AI 비용과 크롤 비용이 이중으로 나간다.
  #    수동 실행(workflow_dispatch)은 비상용으로 남겨둔다.
  # schedule:
    # 주 1회 · 매주 월요일 KST 오전 10시 (UTC 월요일 01:00). 비용(Apify) 고려한 주간 주기.
  #   - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      creator_id:
        description: "특정 크리에이터 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""
      since_hours:
        description: "최근 N시간 내 추가된 크리에이터만 크롤(0=전체). bat 즉시 크롤은 24."
        required: false
        default: "0"
      ig_limit:
        description: "인스타 프로필당 최신 게시물 수(Apify 결과당 과금). 기본 5, 0=무제한(전량 백필)."
        required: false
        default: "5"

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 무제한(전량) 백필 시 인스타 수집·다운로드가 오래 걸릴 수 있어 넉넉히(스케줄 실행은 훨씬 일찍 끝남).
    timeout-minutes: 120
    # Node Playwright 크롤러는 owned-media-monitor/ 에 격리.
    defaults:
      run:
        working-directory: owned-media-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ : @supabase/supabase-js(realtime-js)가 요구하는 네이티브 WebSocket 내장(20은 없어서 실패).
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Install yt-dlp + ffmpeg (유튜브 쇼츠 나열·다운로드용)
        # 설치 실패해도 크롤은 계속(다운로드 못 하면 임베드로 폴백)되도록 best-effort.
        continue-on-error: true
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRAWL_CREATOR_ID: ${{ github.event.inputs.creator_id }}
          # 최근 N시간 내 추가된 크리에이터만(bat 즉시 크롤=24). 스케줄 실행 시엔 비어서 전체.
          CRAWL_SINCE_HOURS: ${{ github.event.inputs.since_hours }}
          # 인스타 수집은 Apify instagram-scraper 사용(없으면 인스타는 건너뜀). 유튜브는 Playwright(Apify 불필요).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 프로필당 최신 개수(비용 조절). 스케줄(빈 입력)은 5, dispatch 로 백필 시 ig_limit 지정.
          IG_RESULTS_LIMIT: ${{ github.event.inputs.ig_limit || '5' }}
        run: node crawl.mjs
