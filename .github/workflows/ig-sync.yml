name: Instagram Sync

on:
  # ⚠️ 자동 스케줄은 인스타 연동 셋업(메타 앱 + Secrets: APP_URL, CRON_SECRET) 완료 전까지 비활성화.
  #    셋업이 끝나면 아래 schedule 블록의 주석(#)을 풀어 8시간마다 자동 동기화하세요.
  # schedule:
  #   - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "job (sync | refresh)"
        required: false
        default: "sync"

# 필요한 GitHub Secrets: APP_URL(예: https://zerotomax.kr), CRON_SECRET(앱 env 와 동일)
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Instagram sync
        run: |
          JOB="${{ github.event.inputs.job }}"
          JOB="${JOB:-sync}"
          curl -fsS --max-time 600 -X POST \
            "${{ secrets.APP_URL }}/api/instagram/cron?job=${JOB}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" || (echo "sync 호출 실패" && exit 1)
