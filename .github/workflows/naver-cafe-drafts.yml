name: Naver Cafe Daily Drafts (AI)

on:
  schedule:
    # 매일 KST 오전 7시 (UTC 22:00) — 카페별 자동 초안 3개(Claude, 서버 공용 키)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call auto-drafts API (deployed)
        # Vercel 배포 라우트 호출 — ANTHROPIC_API_KEY 는 Vercel 환경변수에 있어야 함.
        run: |
          curl -sS -X POST "https://da-ad-planner.vercel.app/api/naver-cafe/auto-drafts" \
            -H "Content-Type: application/json" -d '{}' | head -c 800
