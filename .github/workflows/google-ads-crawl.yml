name: Crawl Google Ads (Transparency Center)

on:
  schedule:
    # 월 1회 · 매월 1일 KST 오전 10시 (UTC 1일 01:00).
    # ⚠️ 비용 근거: 전체 재수집 1회 ≈ $29 (07-07 $29.91 / 07-14 $28.61 실측).
    #    주간(화요일)이던 시절 월 $116~125 소진 → 월 1회로 변경해 ≈ $29/월 로 축소.
    #    더 줄이려면 광고주당 수집 상한(GA_MAX_ADS)이나 주기를 더 늘릴 것.
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      target_id:
        description: "특정 광고주 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""
      since_hours:
        description: "최근 N시간 내 추가된 광고주만 크롤(0=전체). bat 즉시 크롤은 24."
        required: false
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 광고주별 병렬 실행 + 전량수집이라 넉넉히(대부분 이보다 훨씬 일찍 끝남).
    timeout-minutes: 180
    defaults:
      run:
        working-directory: google-ads-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ : @supabase/supabase-js(realtime-js)가 요구하는 네이티브 WebSocket 내장.
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CRAWL_TARGET_ID: ${{ github.event.inputs.target_id }}
          CRAWL_SINCE_HOURS: ${{ github.event.inputs.since_hours }}
          # 동시에 돌릴 광고주(=Apify 병렬 실행) 수. Apify 플랜 동시실행 한도에 맞춰 조정.
          GA_CONCURRENCY: "5"
        run: node crawl.mjs
