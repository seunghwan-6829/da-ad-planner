name: Crawl Google Ads (Transparency Center)

on:
  schedule:
    # 매주 화 KST 오전 10시(UTC 화 01:00)에 "확인"만 돌린다.
    # ⚠️ 실제 재수집 주기는 크롤러의 광고주별 40일 가드(GA_MIN_INTERVAL_DAYS=40)가 결정한다.
    #    40일 안에 이미 크롤된 광고주는 건너뛰므로 광고주 1명당 실제 크롤은 약 6주(42일)에 1번,
    #    그리고 광고주마다 시점이 달라져 비용이 주 단위로 분산된다(한 번에 $29 몰리는 것 방지).
    # 비용 근거: 전량 1회 ≈ $29 실측(07-07 $29.91 / 07-14 $28.61). 주간 전량이던 때 월 $116~125 소진.
    - cron: "0 1 * * 2"
  workflow_dispatch:
    inputs:
      target_id:
        description: "특정 광고주 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""
      since_hours:
        description: "최근 N시간 내 추가된 광고주만 크롤(0=전체). bat 즉시 크롤은 24."
        required: false
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 광고주별 병렬 실행 + 전량수집이라 넉넉히(대부분 이보다 훨씬 일찍 끝남).
    timeout-minutes: 180
    defaults:
      run:
        working-directory: google-ads-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ : @supabase/supabase-js(realtime-js)가 요구하는 네이티브 WebSocket 내장.
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CRAWL_TARGET_ID: ${{ github.event.inputs.target_id }}
          CRAWL_SINCE_HOURS: ${{ github.event.inputs.since_hours }}
          # 동시에 돌릴 광고주(=Apify 병렬 실행) 수. Apify 플랜 동시실행 한도에 맞춰 조정.
          GA_CONCURRENCY: "5"
        run: node crawl.mjs
