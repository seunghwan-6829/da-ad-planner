name: PB Weekly AI Report

on:
  # ⛔ 2026-09-02 통합으로 이 저장소의 자동 실행을 중단했다.
  #    모든 크론은 seunghwan-6829/zerotomax-website 에서 돈다(같은 워크플로가 그대로 있고 Secrets 도 옮겼다).
  #    여기 두면 같은 작업이 두 번 돌아 AI 비용과 크롤 비용이 이중으로 나간다.
  #    수동 실행(workflow_dispatch)은 비상용으로 남겨둔다.
  # schedule:
    # 매주 월요일 KST 오전 7시 30분 (UTC 일요일 22:30) — 지난주(월~일) 데이터로 AI 주간 진단 리포트 자동 작성
  #   - cron: "30 22 * * 0"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call weekly report cron (deployed)
        # Vercel 배포 라우트 호출 — ANTHROPIC_API_KEY 는 Vercel 환경변수 사용.
        # 이미 그 주 리포트가 있으면 서버가 already 로 스킵(멱등)한다.
        run: |
          curl -sS "https://zerotomax.kr/api/pb/weekly-report/cron" | head -c 800
