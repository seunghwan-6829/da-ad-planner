name: Fetch Google Ad Videos (bulk backfill)

# ⚠️ 자동 스케줄 없음(수동 전용). 영상은 기본적으로 "재생할 때만" 온디맨드로 받아 저장하므로,
#    전량 백필은 비용이 큼(영상당 ~$0.06 → 수천개면 수백 달러). 필요할 때만 아래 dispatch 로 수동 실행.
#    범위 조절: max_videos(다운로드 상한), RESOLVE_MAX(상세해석 상한)은 crawl 잡 env 로도 조정 가능.
on:
  workflow_dispatch:
    inputs:
      max_videos:
        description: "이번 실행 최대 영상 수(0=전체, 이어받기 됨)"
        required: false
        default: "0"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: google-ads-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Download embed-blocked ad videos (via Apify)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos }}
        run: node backfill-videos.mjs
