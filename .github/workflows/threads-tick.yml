name: Threads Publish Tick

on:
  schedule:
    # 10분마다 — 예약/슬롯 발행(브랜드별 토큰·슬롯·일 상한). 슬롯 윈도우 ±60분이라 10분 간격이면 놓치지 않음.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call threads tick (deployed)
        # 브랜드별 THREADS_TOKEN_<ID> 는 Vercel 환경변수. CRON_SECRET 설정 시에만 검증(미설정이면 개방).
        run: |
          curl -sS -X POST "https://da-ad-planner.vercel.app/api/threads/tick" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -d '{}' | head -c 800
