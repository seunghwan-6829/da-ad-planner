name: Naver Cafe Auto-Schedule Tick

on:
  # ⛔ 2026-09-02 통합으로 이 저장소의 자동 실행을 중단했다.
  #    모든 크론은 seunghwan-6829/zerotomax-website 에서 돈다(같은 워크플로가 그대로 있고 Secrets 도 옮겼다).
  #    여기 두면 같은 작업이 두 번 돌아 AI 비용과 크롤 비용이 이중으로 나간다.
  #    수동 실행(workflow_dispatch)은 비상용으로 남겨둔다.
  # schedule:
    # 매시각 — 발행처 자동 스케줄(주기 도래 시 초안 생성, auto_publish 면 승인). PC 꺼져도 서버가 생성.
  #   - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call naver-cafe tick (deployed)
        # ANTHROPIC_API_KEY 는 Vercel 환경변수. CRON_SECRET 설정 시에만 검증(미설정이면 개방).
        run: |
          curl -sS -X POST "https://da-ad-planner.vercel.app/api/naver-cafe/tick" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -d '{}' | head -c 800
