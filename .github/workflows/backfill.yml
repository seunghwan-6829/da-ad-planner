name: Backfill Meta Ad Media

# 기존에 URL로만 저장된 소재를 우리 스토리지로 일괄 다운로드 보관(수동 실행 전용).
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meta-ad-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-ad-monitor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (영상 프레임 추출용)
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Backfill media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.backfill_media
