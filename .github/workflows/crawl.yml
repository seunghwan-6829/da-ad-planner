name: Crawl Meta Ad Library

on:
  schedule:
    # 5일마다 UTC 18:00(KST 새벽 03:00) — 매월 1,6,11,16,21,26,31일에 실행
    - cron: "0 18 */5 * *"
  workflow_dispatch:
    inputs:
      target_id:
        description: "특정 브랜드 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 파이썬 크롤러(src/, config/, requirements.txt)는 meta-ad-monitor/ 에 그대로 둔다.
    defaults:
      run:
        working-directory: meta-ad-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-ad-monitor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ensure ffmpeg (영상 프레임 추출용)
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRAWL_TARGET_ID: ${{ github.event.inputs.target_id }}
        run: python -m src.run_cloud
