name: Crawl Meta Ad Library

on:
  schedule:
    # 매주 화·목 KST 오전 9시 (UTC 화·목 00:00). 상위 ~30개씩 갱신.
    - cron: "0 0 * * 2,4"
  workflow_dispatch:
    inputs:
      target_id:
        description: "특정 브랜드 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 전체 크롤이면 8개 병렬로 분담(82개도 45분 내). 단일 브랜드 dispatch면 청크0만 실제 크롤(나머지는 run_cloud가 즉시 종료).
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    # 파이썬 크롤러(src/, config/, requirements.txt)는 meta-ad-monitor/ 에 그대로 둔다.
    defaults:
      run:
        working-directory: meta-ad-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-ad-monitor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ensure ffmpeg (영상 프레임 추출용)
        # ffmpeg 는 프레임 추출(부가기능)용. 설치가 느리거나 실패해도 크롤(광고/영상 저장)은 계속돼야 하므로
        # continue-on-error 로 두어 이 단계 실패가 잡 전체를 죽이지 않게 한다.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          ffmpeg -version >/dev/null 2>&1 && echo "ffmpeg 이미 설치됨" && exit 0
          sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRAWL_TARGET_ID: ${{ github.event.inputs.target_id }}
          CRAWL_CHUNK: ${{ matrix.chunk }}
          CRAWL_CHUNKS: "8"
          # 레지던셜 프록시(있으면 전 광고 수집, 없으면 직접 접속=상위 ~30개)
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python -m src.run_cloud

  # 크롤 직후, 다운로드에 실패해 만료 CDN URL 로만 남은(downloaded=false) 소재를 다시 받아
  # 영구 보관한다. 메타 CDN URL 은 며칠이면 만료되므로 "수집 직후"가 유일한 구조 타이밍 —
  # 이 잡이 없으면 실패분은 다음 크롤까지 방치되다 영영 유실된다(검은 화면의 원인).
  refill:
    runs-on: ubuntu-latest
    needs: crawl
    if: always()   # 일부 청크가 실패해도 나머지 실패분 구조는 돌린다
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meta-ad-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-ad-monitor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (영상 프레임 추출용)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          ffmpeg -version >/dev/null 2>&1 && echo "ffmpeg 이미 설치됨" && exit 0
          sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Refill missing media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.refill_media
