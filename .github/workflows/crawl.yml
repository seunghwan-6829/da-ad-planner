name: Crawl Meta Ad Library

on:
  schedule:
    # 5일마다 UTC 18:00(KST 새벽 03:00) — 매월 1,6,11,16,21,26,31일에 실행
    - cron: "0 18 */5 * *"
  workflow_dispatch:
    inputs:
      target_id:
        description: "특정 브랜드 id만 즉시 크롤(비우면 enabled 전체)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 단일 브랜드 즉시 크롤(target_id 있음)이면 청크 0 하나만, 전체 크롤이면 8개 병렬로 분담(82개도 45분 내).
    if: ${{ github.event.inputs.target_id == '' || matrix.chunk == 0 }}
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    # 파이썬 크롤러(src/, config/, requirements.txt)는 meta-ad-monitor/ 에 그대로 둔다.
    defaults:
      run:
        working-directory: meta-ad-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-ad-monitor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ensure ffmpeg (영상 프레임 추출용)
        timeout-minutes: 5  # apt 행(hang) 시 전체 30분 잡아먹지 않게 빠르게 실패
        run: |
          ffmpeg -version >/dev/null 2>&1 && echo "ffmpeg 이미 설치됨" && exit 0
          sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRAWL_TARGET_ID: ${{ github.event.inputs.target_id }}
          CRAWL_CHUNK: ${{ matrix.chunk }}
          CRAWL_CHUNKS: "8"
          # 레지던셜 프록시(있으면 전 광고 수집, 없으면 직접 접속=상위 ~30개)
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python -m src.run_cloud
